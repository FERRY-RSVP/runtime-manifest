name: PR Checks

# Releases here ship by tag (see major-tag.yml), so nothing gates a merge to
# main today. This runs the full local verification suite on every PR, plus
# Claude review.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        # package-lock.json is gitignored in this repo, so `npm ci` (which
        # requires a lockfile) and setup-node's `cache: npm` (which keys on
        # one) would both fail here.
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  review:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: FERRY-RSVP/ci-workflows/.github/workflows/code-review.yml@v1
    secrets: inherit
