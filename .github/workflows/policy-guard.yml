name: Policy Guard

# Architecture policy guard (enforce mode). Judges every package.json against
# the ferryrsvp.policy it declares; violations fail the check. See
# FERRY-RSVP/ci-workflows policy-guard/ for the policy set.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-guard:
    uses: FERRY-RSVP/ci-workflows/.github/workflows/policy-guard.yml@v1
    with:
      mode: enforce
